image: docker:18-git

pipelines:
  default:
     - step:
         name: "ROS build"
         services:
           - docker
         script:
           - apk add --update bash coreutils tar
           - ./pull_submodules.sh
           - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci -b master
           - .industrial_ci/bitbucket.sh BUILDER="colcon" ROS_DISTRO=melodic  UPSTREAM_WORKSPACE="agribot_msgs agribot_common"

definitions:
  services:
    docker:
      memory: 3072
